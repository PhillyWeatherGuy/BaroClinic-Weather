<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>BaroClinic Weather</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no" />
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    
    <!-- MapLibre GL JS 2D Map Engine -->
    <script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
    <link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet" />
    
    <!-- Three.js & OrbitControls for 3D Earth Globe Engine -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <link href="./css/main.css" rel="stylesheet" />
    <link href="./css/ui.css" rel="stylesheet" />
</head>
<body>

    <div id="splash-screen">
        <div id="splash-branding">
            <img src="./assets/IMG_2466.png" id="splash-logo" alt="BaroClinic Logo">
            <h2 id="splash-text">LOADING MODELS...</h2>
        </div>
        
        <div id="home-menu-grid">
            <button class="menu-card" id="card-models" data-target="modelViewer">
                <h3>Model Viewer</h3>
                <p>Interactive Global GFS & ECMWF</p>
            </button>
            <button class="menu-card" id="card-satellite" data-target="satellite">
                <h3>Satellite</h3>
                <p>Real-time GOES Imagery</p>
            </button>
            <button class="menu-card" id="card-radar" data-target="radar">
                <h3>Radar</h3>
                <p>High-Res Precipitation</p>
            </button>
            <button class="menu-card" id="card-tropics" data-target="tropics">
                <h3>Tropics</h3>
                <p>Hurricane & Cyclone Tracking</p>
            </button>
        </div>
    </div>

    <!-- Top Navigation Bar -->
    <nav id="top-nav">
        <div class="nav-left">
            <div class="logo">BaroClinic</div>
            <div id="top-time-container">
                <div id="app-clock" class="clock-display">--:--</div>
            </div>
        </div>
        
        <div class="nav-right">
            <!-- Model Trigger Button -->
            <button id="btn-model-menu" class="nav-dropdown-btn">
                <span>Model</span>
                <svg class="chevron-icon" width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
        </div>
    </nav>

    <!-- 🌟 Horizontal Model Category Sub-Bar (Positioned directly beneath top nav) -->
    <div id="model-category-bar" class="sub-nav-bar" style="display: none;">
        <div class="category-scroll-container">
            <button class="model-cat-pill active" data-category="global">Global</button>
            <button class="model-cat-pill" data-category="ensemble">Ensemble</button>
            <button class="model-cat-pill" data-category="hurricane">Hurricane</button>
            <button class="model-cat-pill" data-category="mesoscale">Mesoscale</button>
            <button class="model-cat-pill" data-category="climate">Climate</button>
        </div>
    </div>

    <!-- Compact Bottom Timeline Capsule -->
    <div id="timeline-container">
        <div class="timeline-controls">
            <!-- Model Run Dropdown Selector -->
            <div class="model-run-dropdown-container">
                <button id="model-run-toggle" class="run-toggle-btn">
                    <span id="current-run-label">Loading...</span>
                    <svg width="10" height="6" viewBox="0 0 10 6" fill="none"><path d="M1 1L5 5L9 1" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
                </button>
                <div id="model-run-menu" class="run-dropdown-menu" style="display: none;">
                    <!-- Dynamically populated via JS -->
                </div>
            </div>
    
            <button id="btn-prev" class="ctrl-btn" title="Previous Frame">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="19 20 9 12 19 4 19 20"></polygon><line x1="5" y1="19" x2="5" y2="5"></line></svg>
            </button>
            <button id="btn-play" class="ctrl-btn play-btn" title="Play/Pause">
                <svg id="play-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><polygon points="5 3 19 12 5 21 5 3"></polygon></svg>
                <svg id="pause-icon" width="14" height="14" viewBox="0 0 24 24" fill="currentColor" style="display: none;"><rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect></svg>
            </button>
            <button id="btn-next" class="ctrl-btn" title="Next Frame">
                <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polygon points="5 4 15 12 5 20 5 4"></polygon><line x1="19" y1="5" x2="19" y2="19"></line></svg>
            </button>

            <!-- 🌟 Vector SVG Globe Icon Button -->
            <button id="btn-globe" class="ctrl-btn globe-btn active" title="Toggle 3D Globe">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="2" y1="12" x2="22" y2="12"></line>
                    <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
                </svg>
            </button>

            <button id="btn-gif" class="gif-btn" title="Create GIF">GIF</button>
        </div>
    
        <div class="timeline-slider-wrapper">
            <span id="time-label">F000</span>
            <input id="timeline-slider" type="range" min="0" max="0" value="0">
        </div>
    </div>

    <div id="status-toast" style="display: none;">Loading engine...</div>
    
    <div id="map"></div>
    <div id="globe-container" style="display: none;"></div>

    <script type="module" src="./js/app.js"></script>
</body>
</html>
